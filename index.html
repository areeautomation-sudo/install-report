<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>รายงานงานติดตั้ง</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { --pri:#06c755; --dark:#1f4e78; --bg:#f3f5f8; --card:#fff; --txt:#1c2733; --mut:#6b7785; --err:#d93025; --bd:#dde3ea; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--txt); font-size:16px; }
  header { background:var(--dark); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:18px; } header small { opacity:.8; }
  main { padding:12px 16px 110px; max-width:640px; margin:auto; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  label.t { display:block; font-weight:700; margin-bottom:6px; }
  input, select, textarea { width:100%; padding:11px 12px; border:1px solid var(--bd); border-radius:8px; font:inherit; background:#fff; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--pri); border-color:transparent; }
  .emp-list { max-height:240px; overflow:auto; border:1px solid var(--bd); border-radius:8px; margin-top:8px; }
  .emp-list label { display:flex; gap:10px; align-items:center; padding:10px 12px; border-bottom:1px solid #eef1f4; }
  .emp-list label:last-child { border-bottom:0; }
  .emp-list input { width:20px; height:20px; accent-color:var(--pri); }
  .emp-list small { color:var(--mut); margin-left:auto; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { background:#e7f8ee; color:#067a36; padding:4px 10px; border-radius:20px; font-size:14px; }
  .task { border:1px solid var(--bd); border-radius:10px; padding:10px; margin-bottom:10px; position:relative; }
  .task .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .task .row span { font-size:13px; color:var(--mut); display:block; margin-bottom:3px; }
  .task .per { font-size:13px; color:#067a36; margin-top:6px; min-height:18px; }
  .crew-wrap { margin-top:8px; }
  .crew-wrap > span { font-size:13px; color:var(--mut); display:block; margin-bottom:4px; }
  .crew { display:flex; flex-wrap:wrap; gap:6px; }
  .crew:empty::before { content:'เลือกพนักงานด้านบนก่อน'; font-size:13px; color:var(--mut); }
  .crew button { border:1px solid var(--bd); background:#fff; color:var(--mut); border-radius:20px; padding:6px 12px; font:inherit; font-size:14px; }
  .crew button.on { background:#e7f8ee; border-color:var(--pri); color:#067a36; font-weight:600; }
  .crew button.on::before { content:'✓ '; }
  .ph-toggle { margin-top:8px; border:0; background:none; color:#1f4e78; font:inherit; font-size:14px; text-decoration:underline; padding:0; }
  .ph-grid { margin-top:6px; display:grid; grid-template-columns:1fr 96px; gap:6px 10px; align-items:center; background:#f6f8fa; border-radius:8px; padding:8px 10px; }
  .ph-grid span { font-size:14px; }
  .ph-grid input { padding:6px 8px; }
  .ph-grid small { grid-column:1 / -1; color:var(--mut); font-size:12px; }
  .msg.warn { background:#fff4dc; color:#6b4a00; display:block; white-space:pre-line; }
  .del { position:absolute; top:-9px; right:-9px; width:28px; height:28px; border-radius:50%; border:0; background:var(--err); color:#fff; font-size:16px; }
  .btn-add { width:100%; padding:11px; border:2px dashed var(--pri); background:#fff; color:var(--pri); border-radius:10px; font:inherit; font-weight:700; }
  footer { position:fixed; bottom:0; left:0; right:0; background:#fff; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow:0 -2px 8px rgba(0,0,0,.08); }
  .btn-send { width:100%; max-width:640px; display:block; margin:auto; padding:14px; border:0; border-radius:10px; background:var(--pri); color:#fff; font:inherit; font-size:18px; font-weight:700; }
  .btn-send:disabled { opacity:.5; }
  .msg { padding:12px; border-radius:8px; margin-bottom:12px; display:none; }
  .msg.err { background:#fdecea; color:var(--err); display:block; }
  #loading, #done { text-align:center; padding:60px 20px; }
  .spin { width:40px; height:40px; border:4px solid #ddd; border-top-color:var(--pri); border-radius:50%; animation:s 1s linear infinite; margin:0 auto 12px; }
  @keyframes s { to { transform:rotate(360deg); } }
  .combo { position:relative; }
  .combo-list { position:absolute; left:0; right:0; top:100%; z-index:20; background:#fff; border:1px solid var(--bd); border-radius:8px; margin-top:4px; max-height:260px; overflow:auto; box-shadow:0 6px 16px rgba(0,0,0,.12); }
  .combo-list .grp { padding:6px 12px; font-size:12px; font-weight:700; color:var(--mut); background:#f6f8fa; }
  .combo-list .opt { padding:11px 12px; border-bottom:1px solid #eef1f4; cursor:pointer; }
  .combo-list .opt:active, .combo-list .opt.act { background:#e7f8ee; }
  .combo-list .opt small { color:var(--mut); }
  .combo-list .none { padding:12px; color:var(--mut); }
  .t-search.ok { border-color:var(--pri); background:#f4fdf7; }
  .photos { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:10px; }
  .photos:empty { display:none; }
  .ph { position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; background:#eef1f4; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .ph button { position:absolute; top:4px; right:4px; width:26px; height:26px; border-radius:50%; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:15px; }
  .pdf-btn { display:block; text-align:center; padding:13px; margin:14px 0 4px; border-radius:10px; background:var(--dark); color:#fff; text-decoration:none; font-weight:700; }
  .warn { background:#fff4e5; color:#8a4b00; padding:10px; border-radius:8px; margin-top:10px; font-size:14px; }
  .wx-label { font-size:13px; color:var(--mut); margin:6px 0 4px; }
  .chips-sel { display:flex; flex-wrap:wrap; gap:6px; }
  .chips-sel button { border:1px solid var(--bd); background:#fff; border-radius:18px; padding:8px 12px; font:inherit; font-size:14px; color:var(--txt); }
  .chips-sel button.on { background:var(--dark); border-color:var(--dark); color:#fff; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .sub { font-size:13px; color:var(--mut); display:block; margin-bottom:3px; }
  .issue { display:grid; grid-template-columns:130px 1fr 34px; gap:6px; margin-bottom:8px; align-items:center; }
  .issue .x { width:34px; height:34px; border-radius:50%; border:0; background:#eef1f4; color:var(--err); font-size:16px; }
  .hidden { display:none !important; }
  table.sum { width:100%; border-collapse:collapse; font-size:14px; text-align:left; margin-top:10px; }
  table.sum td { padding:6px 4px; border-bottom:1px solid #eef1f4; }
</style>
</head>
<body>
<header><h1>📋 รายงานงานติดตั้งรายวัน</h1><small id="who">กำลังเชื่อมต่อ LINE…</small></header>

<div id="loading"><div class="spin"></div>กำลังโหลดข้อมูล…</div>

<main id="form" class="hidden">
  <div id="msg" class="msg"></div>

  <div class="card">
    <label class="t">วันที่ทำงาน</label>
    <input type="date" id="workDate">
  </div>

  <div class="card">
    <label class="t">Site งาน</label>
    <select id="site"><option value="">— เลือก Site —</option></select>
  </div>

  <div class="card">
    <label class="t">พนักงานที่ทำงาน (เลือกได้หลายคน)</label>
    <input type="search" id="empSearch" placeholder="🔍 ค้นหาชื่อ">
    <div class="emp-list" id="empList"></div>
    <div class="chips" id="empChips"></div>
  </div>

  <div class="card">
    <label class="t">รายการงานที่ทำ</label>
    <div id="tasks"></div>
    <button class="btn-add" id="addTask" type="button">+ เพิ่มรายการงาน</button>
  </div>

  <div class="card">
    <label class="t">สภาพอากาศวันนี้ <small style="font-weight:400;color:var(--mut)">(ถ้ามี)</small></label>
    <div class="wx-label">ช่วงเช้า</div>
    <div class="chips-sel" id="wxAM"></div>
    <div class="wx-label">ช่วงบ่าย</div>
    <div class="chips-sel" id="wxPM"></div>
  </div>

  <div class="card">
    <label class="t">ปัญหา / อุปสรรค <small style="font-weight:400;color:var(--mut)">(ถ้ามี)</small></label>
    <div id="issues"></div>
    <button class="btn-add" id="addIssue" type="button">+ เพิ่มปัญหา</button>
  </div>

  <div class="card">
    <label class="t">แผนงานวันถัดไป</label>
    <textarea id="plan" rows="3" maxlength="500" placeholder="เช่น ร้อยสายไฟชั้น 2 ต่ออีก 150 ม."></textarea>
    <div class="row2">
      <div><span class="sub">กำลังคนที่ต้องการ (คน)</span><input id="planMan" type="number" inputmode="numeric" min="0" max="200" step="1"></div>
    </div>
  </div>

  <div class="card">
    <label class="t">รูปภาพหน้างาน <small style="font-weight:400;color:var(--mut)">(ไม่บังคับ สูงสุด 6 รูป)</small></label>
    <div class="photos" id="photoGrid"></div>
    <input type="file" id="photoInput" accept="image/*" multiple hidden>
    <button class="btn-add" id="addPhoto" type="button">📷 ถ่ายรูป / เลือกรูป</button>
  </div>

  <div class="card">
    <label class="t">หมายเหตุ (ถ้ามี)</label>
    <textarea id="note" rows="2" maxlength="500" placeholder="ข้อมูลอื่น ๆ ที่ต้องการแจ้ง"></textarea>
  </div>
</main>

<div id="done" class="hidden">
  <div style="font-size:56px">✅</div>
  <h2>บันทึกเรียบร้อย</h2>
  <div id="doneInfo"></div>
  <p><button class="btn-send" id="again" type="button">ส่งรายงานใหม่</button></p>
</div>

<footer id="foot" class="hidden"><button class="btn-send" id="send" type="button">ส่งรายงาน</button></footer>

<script>
/* ============ ตั้งค่า ============ */
const LIFF_ID = '2011758041-R0zlVvGW'; // ← ใส่ LIFF ID หลังสร้าง LIFF app
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyk9W0qm6sUx3CuGofqb63W9IEuan2M_c-JrptyD623M9lr3Qv0RnWxmaZ5y_KNwNzJFA/exec';
/* ================================= */

const DRAFT_KEY = 'install_report_draft_v1';
let idToken = '', master = { sites: [], employees: [], tasks: [] };
const $ = id => document.getElementById(id);

async function api(action, extra) {
  const r = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // ไม่เกิด CORS preflight
    body: JSON.stringify(Object.assign({ action, idToken }, extra || {}))
  });
  return r.json();
}

function todayStr() {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken();
    const res = await api('master');
    if (!res.ok) {
      if (res.code === 'AUTH') { liff.logout(); liff.login(); return; }
      showFatal(res.error + (res.userId ? '<br><br>UserID:<br><code>' + res.userId + '</code>' : ''));
      return;
    }
    master = res.data;
    $('who').textContent = 'ผู้รายงาน: ' + (res.user.name || '-');
    buildForm();
    restoreDraft();
    $('loading').classList.add('hidden');
    $('form').classList.remove('hidden');
    $('foot').classList.remove('hidden');
  } catch (e) {
    showFatal('เชื่อมต่อไม่สำเร็จ: ' + e.message);
  }
}

function showFatal(html) { $('loading').innerHTML = '<div style="font-size:40px">⚠️</div>' + html; }

function buildForm() {
  $('workDate').value = todayStr();
  $('workDate').max = todayStr();
  master.sites.forEach(s => $('site').add(new Option(s.name, s.id)));
  $('empList').innerHTML = master.employees.map(e =>
    `<label data-name="${esc(e.name).toLowerCase()}"><input type="checkbox" value="${esc(e.id)}"> ${esc(e.name)} <small>${esc(e.position)}</small></label>`
  ).join('');
  $('empList').addEventListener('change', () => { renderChips(); updatePer(); saveDraft(); });
  $('empSearch').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    $('empList').querySelectorAll('label').forEach(l => l.classList.toggle('hidden', q && !l.dataset.name.includes(q)));
  });
  $('addTask').onclick = () => { addTaskRow(); saveDraft(); };
  ['workDate', 'site', 'note'].forEach(id => $(id).addEventListener('change', saveDraft));
  $('send').onclick = submit;
  setupPhotos();
  setupWeather();
  $('addIssue').onclick = () => { addIssueRow(); saveDraft(); };
  ['plan', 'planMan'].forEach(id => $(id).addEventListener('change', saveDraft));
  $('again').onclick = () => location.reload();
}

function taskOptions(selected) {
  const groups = {};
  master.tasks.forEach(t => (groups[t.category] = groups[t.category] || []).push(t));
  return '<option value="">— เลือกงาน —</option>' + Object.keys(groups).map(g =>
    `<optgroup label="${esc(g)}">` + groups[g].map(t =>
      `<option value="${esc(t.id)}" ${t.id === selected ? 'selected' : ''}>${esc(t.name)} (${esc(t.unit)})</option>`).join('') + '</optgroup>'
  ).join('');
}

function addTaskRow(v) {
  v = v || {};
  const div = document.createElement('div');
  div.className = 'task';
  div.innerHTML = `
    <button class="del" type="button" title="ลบ">×</button>
    <div class="combo">
      <input class="t-search" type="search" autocomplete="off" placeholder="🔍 พิมพ์ค้นหางาน เช่น EMT, THW, โคม">
      <input class="t-id" type="hidden" value="">
      <div class="combo-list hidden"></div>
    </div>
    <div class="row">
      <div><span class="unit">จำนวน</span><input class="t-qty" type="number" inputmode="decimal" min="0" step="any" value="${v.qty || ''}"></div>
      <div><span>ชั่วโมงที่ใช้ (ต่อคน)</span><input class="t-hrs" type="number" inputmode="decimal" min="0" max="24" step="0.5" value="${v.hours || ''}"></div>
    </div>
    <div class="crew-wrap"><span>ผู้ทำงานนี้ (แตะชื่อเพื่อเอาออก/ใส่กลับ)</span><div class="crew"></div>
      <button type="button" class="ph-toggle">⏱ แต่ละคนใช้ชั่วโมงไม่เท่ากัน? กำหนดรายคน</button>
      <div class="ph-grid hidden"></div></div>
    <div class="per"></div>`;
  div.dataset.off = JSON.stringify(v.off || []);   // เก็บ "คนที่เอาออก" → คนที่เพิ่มทีหลังจะถูกเลือกให้อัตโนมัติ
  div.dataset.ov = JSON.stringify(v.hrsOv || {});  // ชั่วโมงรายคนที่ต่างจากค่าหลัก {empId: ชม.}
  if (Object.keys(v.hrsOv || {}).length) div.querySelector('.ph-grid').classList.remove('hidden');
  div.querySelector('.ph-toggle').onclick = () => { div.querySelector('.ph-grid').classList.toggle('hidden'); renderCrew(div); };
  div.querySelector('.ph-grid').addEventListener('input', e => {
    const inp = e.target.closest('input[data-id]'); if (!inp) return;
    e.stopPropagation();
    const ov = JSON.parse(div.dataset.ov || '{}'), val = inp.value.trim();
    if (val === '') delete ov[inp.dataset.id]; else ov[inp.dataset.id] = val;
    div.dataset.ov = JSON.stringify(ov);
    updatePer(); saveDraft();
  });
  div.querySelector('.crew').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const off = new Set(JSON.parse(div.dataset.off));
    off.has(b.dataset.id) ? off.delete(b.dataset.id) : off.add(b.dataset.id);
    div.dataset.off = JSON.stringify([...off]);
    renderCrew(div); updatePer(); saveDraft();
  };
  div.querySelector('.del').onclick = () => { div.remove(); saveDraft(); };
  div.addEventListener('input', () => { updatePer(); saveDraft(); });
  div.addEventListener('change', () => { updatePer(); saveDraft(); });
  setupCombo(div, v.taskId);
  $('tasks').appendChild(div);
  renderCrew(div);
  updatePer();
}

function selectedEmpIds() { return [...$('empList').querySelectorAll('input:checked')].map(i => i.value); }
function empName(id) { const e = master.employees.find(x => x.id === id); return e ? e.name : id; }
function crewIds(div) { const off = new Set(JSON.parse(div.dataset.off || '[]')); return selectedEmpIds().filter(id => !off.has(id)); }
function renderCrew(div) {
  const off = new Set(JSON.parse(div.dataset.off || '[]'));
  div.querySelector('.crew').innerHTML = selectedEmpIds().map(id =>
    `<button type="button" data-id="${esc(id)}" class="${off.has(id) ? '' : 'on'}">${esc(empName(id))}</button>`).join('');
  const grid = div.querySelector('.ph-grid');
  if (grid.classList.contains('hidden')) return;
  const ov = JSON.parse(div.dataset.ov || '{}'), def = div.querySelector('.t-hrs').value;
  grid.innerHTML = crewIds(div).map(id =>
    `<span>${esc(empName(id))}</span><input type="number" inputmode="decimal" min="0" max="24" step="0.5" data-id="${esc(id)}" value="${esc(ov[id] != null ? ov[id] : '')}" placeholder="${esc(def || 'ชม.')}">`).join('') +
    '<small>เว้นว่าง = ใช้ชั่วโมงหลักด้านบน · ปริมาณงานจะแบ่งตามชั่วโมงของแต่ละคน</small>';
}
/* ชั่วโมงของคนนี้ในงานนี้ = ค่าที่กำหนดรายคน ถ้าไม่มีใช้ค่าหลัก */
function hoursOf(div, id) {
  const ov = JSON.parse(div.dataset.ov || '{}');
  return parseFloat(ov[id] != null && ov[id] !== '' ? ov[id] : div.querySelector('.t-hrs').value) || 0;
}

/* ---------- รูปภาพ: ย่อเป็น JPEG ด้านยาวไม่เกิน 1600px ก่อนส่ง ---------- */
const MAX_PHOTOS = 6, MAX_SIDE = 1600;
let photos = [];   // [{ type, data(base64), url(preview) }]

function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL('image/jpeg', 0.8);
      resolve({ type: 'image/jpeg', data: dataUrl.split(',')[1], url: dataUrl });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('อ่านรูปไม่ได้: ' + file.name)); };
    img.src = url;
  });
}
function renderPhotos() {
  $('photoGrid').innerHTML = photos.map((p, i) =>
    `<div class="ph"><img src="${p.url}" alt="รูปที่ ${i + 1}"><button type="button" data-i="${i}" title="ลบ">×</button></div>`).join('');
  $('addPhoto').classList.toggle('hidden', photos.length >= MAX_PHOTOS);
}
function setupPhotos() {
  $('addPhoto').onclick = () => $('photoInput').click();
  $('photoInput').onchange = async e => {
    const picked = [...e.target.files], files = picked.slice(0, MAX_PHOTOS - photos.length);
    e.target.value = '';
    for (const f of files) {
      try { photos.push(await resizeImage(f)); } catch (err) { showErr(err.message); }
    }
    if (picked.length > files.length) showErr(`แนบได้สูงสุด ${MAX_PHOTOS} รูป`);
    renderPhotos();
  };
  $('photoGrid').onclick = e => {
    const b = e.target.closest('button[data-i]'); if (!b) return;
    photos.splice(Number(b.dataset.i), 1); renderPhotos();
  };
}

/* ---------- สภาพอากาศ / ปัญหา ---------- */
const WX_OPTS = ['แดดจัด', 'มีเมฆ', 'ฝนตก 1 ชม.', 'ฝนตก 2 ชม.', 'ฝนตก 3 ชม.', 'ฝนตก 4 ชม.'];
const ISSUE_CATS = ['รอวัสดุ', 'สภาพอากาศ', 'แบบ/ข้อมูลไม่ชัด', 'หน้างานไม่พร้อม', 'เครื่องมือ/อุปกรณ์', 'กำลังคน', 'อื่น ๆ'];
const MAX_ISSUES = 5;

function setupWeather() {
  ['wxAM', 'wxPM'].forEach(id => {
    const box = $(id);
    box.innerHTML = WX_OPTS.map(o => `<button type="button" data-v="${esc(o)}">${esc(o)}</button>`).join('');
    box.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      const on = b.classList.contains('on');
      box.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      if (!on) b.classList.add('on');
      saveDraft();
    };
  });
}
function wxVal(id) { const b = $(id).querySelector('button.on'); return b ? b.dataset.v : ''; }
function setWx(id, v) { $(id).querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }

function addIssueRow(v) {
  v = v || {};
  if (document.querySelectorAll('.issue').length >= MAX_ISSUES) return showErr(`เพิ่มปัญหาได้สูงสุด ${MAX_ISSUES} รายการ`);
  const d = document.createElement('div');
  d.className = 'issue';
  d.innerHTML = `<select class="i-cat">${ISSUE_CATS.map(c => `<option ${c === v.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
    <input class="i-text" type="text" maxlength="200" placeholder="รายละเอียด" value="${esc(v.text || '')}">
    <button class="x" type="button" title="ลบ">×</button>`;
  d.querySelector('.x').onclick = () => { d.remove(); saveDraft(); };
  d.addEventListener('change', saveDraft);
  $('issues').appendChild(d);
}

/* ---------- ช่องเลือกงานแบบพิมพ์ค้นหา ---------- */
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
const taskLabel = t => `${t.name} (${t.unit})`;

function setupCombo(div, selectedId) {
  const inp = div.querySelector('.t-search'), hid = div.querySelector('.t-id'), list = div.querySelector('.combo-list');
  let items = [], act = -1;

  const pick = t => {
    hid.value = t ? t.id : '';
    inp.value = t ? taskLabel(t) : '';
    inp.classList.toggle('ok', !!t);
    list.classList.add('hidden');
    updatePer(); saveDraft();
  };
  const render = () => {
    const words = norm(inp.value).split(' ').filter(Boolean);
    const used = new Set([...document.querySelectorAll('.t-id')].filter(h => h !== hid).map(h => h.value));
    items = master.tasks.filter(t => !used.has(t.id) &&
      words.every(w => norm(t.name + ' ' + t.category + ' ' + t.unit).includes(w)));
    act = items.length ? 0 : -1;
    let html = '', grp = null;
    items.forEach((t, i) => {
      if (t.category !== grp) { grp = t.category; html += `<div class="grp">${esc(grp)}</div>`; }
      html += `<div class="opt${i === act ? ' act' : ''}" data-i="${i}">${esc(t.name)} <small>(${esc(t.unit)})</small></div>`;
    });
    list.innerHTML = html || '<div class="none">ไม่พบงานที่ค้นหา</div>';
    list.classList.remove('hidden');
  };
  const highlight = () => list.querySelectorAll('.opt').forEach(o => {
    const on = Number(o.dataset.i) === act; o.classList.toggle('act', on); if (on) o.scrollIntoView({ block: 'nearest' });
  });

  inp.addEventListener('focus', () => { if (hid.value) inp.select(); render(); });
  inp.addEventListener('input', e => { e.stopPropagation(); hid.value = ''; inp.classList.remove('ok'); render(); updatePer(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); act = Math.min(act + 1, items.length - 1); highlight(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); act = Math.max(act - 1, 0); highlight(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (items[act]) { pick(items[act]); div.querySelector('.t-qty').focus(); } }
    else if (e.key === 'Escape') { list.classList.add('hidden'); }
  });
  // ใช้ pointerdown เพื่อให้เลือกได้ก่อน input เสีย focus (สำคัญบนมือถือ)
  list.addEventListener('pointerdown', e => {
    const o = e.target.closest('.opt'); if (!o) return;
    e.preventDefault(); pick(items[Number(o.dataset.i)]); div.querySelector('.t-qty').focus();
  });
  inp.addEventListener('blur', () => setTimeout(() => {
    list.classList.add('hidden');
    if (!hid.value) {           // พิมพ์ตรงกับชื่องานพอดี → เลือกให้อัตโนมัติ
      const exact = master.tasks.find(t => norm(t.name) === norm(inp.value) || norm(taskLabel(t)) === norm(inp.value));
      if (exact) pick(exact);
    }
  }, 150));

  const init = master.tasks.find(t => t.id === selectedId);
  if (init) { hid.value = init.id; inp.value = taskLabel(init); inp.classList.add('ok'); }
}

function renderChips() {
  const ids = new Set(selectedEmpIds());
  $('empChips').innerHTML = master.employees.filter(e => ids.has(e.id))
    .map(e => `<span class="chip">${esc(e.name)}</span>`).join('') +
    (ids.size ? `<span class="chip" style="background:#1f4e78;color:#fff">${ids.size} คน</span>` : '');
  document.querySelectorAll('.task').forEach(renderCrew);
}

function updatePer() {
  const f = x => x.toLocaleString('th-TH', { maximumFractionDigits: 2 });
  document.querySelectorAll('.task').forEach(div => {
    const ids = crewIds(div), n = ids.length;
    const t = master.tasks.find(x => x.id === div.querySelector('.t-id').value);
    div.querySelector('.unit').textContent = 'จำนวน' + (t ? ` (${t.unit})` : '');
    const def = div.querySelector('.t-hrs').value;
    div.querySelectorAll('.ph-grid input').forEach(i => { i.placeholder = def || 'ชม.'; });
    const q = parseFloat(div.querySelector('.t-qty').value);
    const hs = ids.map(id => hoursOf(div, id)), sum = hs.reduce((a, b) => a + b, 0);
    const equal = hs.every(h => h === hs[0]);
    div.querySelector('.per').textContent = !(t && q > 0 && n > 0) ? ''
      : equal ? `≈ คนละ ${f(q / n)} ${t.unit} (${n} คน)`
      : sum > 0 ? '≈ แบ่งตามชั่วโมง: ' + ids.map((id, k) => `${empName(id)} ${f(q * hs[k] / sum)}`).join(' · ') + ` ${t.unit}` : '';
  });
}

function collect() {
  return {
    workDate: $('workDate').value,
    siteId: $('site').value,
    empIds: selectedEmpIds(),
    items: [...document.querySelectorAll('.task')].map(d => ({
      taskId: d.querySelector('.t-id').value,
      qty: d.querySelector('.t-qty').value,
      hours: d.querySelector('.t-hrs').value,
      empIds: crewIds(d),
      empHours: Object.fromEntries(crewIds(d).map(id => [id, hoursOf(d, id)])),
      off: JSON.parse(d.dataset.off || '[]'),
      hrsOv: JSON.parse(d.dataset.ov || '{}')
    })),
    note: $('note').value.trim(),
    weatherAM: wxVal('wxAM'),
    weatherPM: wxVal('wxPM'),
    issues: [...document.querySelectorAll('.issue')].map(d => ({
      cat: d.querySelector('.i-cat').value, text: d.querySelector('.i-text').value.trim()
    })).filter(i => i.text),
    planTomorrow: $('plan').value.trim(),
    planManpower: $('planMan').value
  };
}

function validate(p) {
  if (!p.workDate) return 'กรุณาเลือกวันที่';
  if (!p.siteId) return 'กรุณาเลือก Site งาน';
  if (!p.empIds.length) return 'กรุณาเลือกพนักงานอย่างน้อย 1 คน';
  if (!p.items.length) return 'กรุณาเพิ่มรายการงาน';
  const ids = new Set();
  for (let i = 0; i < p.items.length; i++) {
    const it = p.items[i], n = i + 1;
    if (!it.taskId) return `รายการที่ ${n}: ยังไม่เลือกงาน (พิมพ์ค้นหาแล้วแตะเลือกจากรายการ)`;
    if (ids.has(it.taskId)) return `รายการที่ ${n}: งานซ้ำกับรายการก่อนหน้า — รวมเป็นรายการเดียว ถ้าแต่ละคนใช้ชั่วโมงต่างกันให้กด "⏱ กำหนดรายคน"`;
    ids.add(it.taskId);
    if (!(parseFloat(it.qty) > 0)) return `รายการที่ ${n}: จำนวนต้องมากกว่า 0`;
    const h = parseFloat(it.hours);
    if (!(h > 0 && h <= 24)) return `รายการที่ ${n}: ชั่วโมงต้องอยู่ระหว่าง 0–24`;
    if (!it.empIds.length) return `รายการที่ ${n}: ต้องมีผู้ทำงานนี้อย่างน้อย 1 คน`;
    const badH = it.empIds.find(id => !(it.empHours[id] > 0 && it.empHours[id] <= 24));
    if (badH) return `รายการที่ ${n}: ชั่วโมงของ ${empName(badH)} ต้องอยู่ระหว่าง 0–24`;
  }
  return '';
}

/* คำเตือน (ส่งต่อได้หลังกดยืนยัน): ชั่วโมงรวมต่อคนเกิน/ไม่ครบ 8 ชม. / มีคนที่ไม่ได้อยู่ในงานไหนเลย */
const MAX_DAY_HOURS = 8;
function warnings(p) {
  const hrs = {}, W = [];
  p.items.forEach(it => it.empIds.forEach(id => { hrs[id] = (hrs[id] || 0) + (it.empHours[id] || 0); }));
  const over = p.empIds.filter(id => hrs[id] > MAX_DAY_HOURS);
  if (over.length) W.push(`⏱ เกิน ${MAX_DAY_HOURS} ชม. — ทำ OT จริงหรือไม่?\n` + over.map(id => `• ${empName(id)} ${hrs[id]} ชม.`).join('\n'));
  const under = p.empIds.filter(id => hrs[id] > 0 && hrs[id] < MAX_DAY_HOURS);
  if (under.length) W.push(`⏳ ไม่ครบ ${MAX_DAY_HOURS} ชม. — ทำครึ่งวัน/ลาหรือไม่?\n` + under.map(id => `• ${empName(id)} ${hrs[id]} ชม.`).join('\n'));
  const idle = p.empIds.filter(id => !hrs[id]);
  if (idle.length) W.push('👤 ไม่ได้อยู่ในงานไหนเลย: ' + idle.map(empName).join(', '));
  return W;
}
let warnAck = '';
function showWarn(list) {
  const m = $('msg');
  m.textContent = '⚠️ ตรวจสอบก่อนส่ง\n\n' + list.join('\n\n') + '\n\n✔ ถ้าถูกต้องแล้ว (เช่น ทำ OT / ทำครึ่งวันจริง) กด "ยืนยันส่ง" ได้เลย\n✎ ถ้าไม่ถูก แก้ไขแล้วกดส่งใหม่';
  m.className = 'msg warn';
  $('send').textContent = 'ยืนยันส่ง (มีคำเตือน)';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function submit() {
  const p = collect();
  const err = validate(p);
  if (err) return showErr(err);
  const W = warnings(p), key = JSON.stringify(W);
  if (W.length && warnAck !== key) { warnAck = key; return showWarn(W); }
  warnAck = '';
  $('msg').className = 'msg';
  p.clientReqId = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random());
  p.photos = photos.map(x => ({ type: x.type, data: x.data }));
  $('send').disabled = true; $('send').textContent = 'กำลังส่งและสร้าง PDF… (ประมาณ 10–20 วินาที)';
  try {
    idToken = liff.getIDToken();
    const res = await api('submit', { payload: p });
    if (!res.ok) {
      if (res.code === 'AUTH') { saveDraft(); showErr('Session หมดอายุ กำลังเข้าสู่ระบบใหม่ (ข้อมูลที่กรอกถูกเก็บไว้)'); setTimeout(() => { liff.logout(); liff.login(); }, 1500); return; }
      return showErr(res.error);
    }
    clearDraft();
    showDone(res);
  } catch (e) {
    saveDraft();
    showErr('ส่งไม่สำเร็จ: ' + e.message + ' (ข้อมูลที่กรอกถูกเก็บไว้ ลองกดส่งใหม่)');
  } finally {
    $('send').disabled = false; $('send').textContent = 'ส่งรายงาน';
  }
}

async function showDone(res) {
  $('form').classList.add('hidden'); $('foot').classList.add('hidden'); $('done').classList.remove('hidden');
  const s = res.summary;
  if (!s) { $('doneInfo').textContent = 'เลขที่ ' + res.reportId; return; }
  $('doneInfo').innerHTML = `<p>เลขที่ ${esc(res.reportId)}<br>${esc(s.date)} · ${esc(s.site)}<br>${s.headcount} คน: ${esc(s.employees.join(', '))}</p>
    <table class="sum">${s.items.map(i => `<tr><td>${esc(i.name)}${crewLbl(i, s) ? `<br><small style="color:var(--mut)">${esc(crewLbl(i, s))}</small>` : ''}</td><td>${i.qty} ${esc(i.unit)}</td><td>${i.crew || s.headcount} คน · ${i.hoursTxt || i.hours} ชม.</td></tr>`).join('')}</table>
    ${(s.cumulative || []).length ? `<p style="margin:14px 0 4px;font-weight:700">📊 ยอดสะสม ${esc(s.site)}</p>
    <table class="sum">${s.cumulative.map(c => `<tr><td>${esc(c.name)}</td><td>${c.qty} ${esc(c.unit)}</td></tr>`).join('')}</table>` : ''}
    ${res.photoCount ? `<p style="color:var(--mut);font-size:14px">🖼 แนบรูป ${res.photoCount} รูป</p>` : ''}
    ${res.pdfUrl ? `<a class="pdf-btn" href="${esc(res.pdfUrl)}" target="_blank" rel="noopener">📄 เปิด PDF Daily Report</a>` : ''}
    ${res.warning ? `<div class="warn">${esc(res.warning)}</div>` : ''}`;
  $('doneInfo').querySelector('.pdf-btn')?.addEventListener('click', e => {
    try { if (liff.isInClient()) { e.preventDefault(); liff.openWindow({ url: res.pdfUrl, external: true }); } } catch (err) {}
  });
  // ส่งสรุปเข้าแชท/กลุ่มที่เปิดฟอร์ม ในนามผู้ใช้ (ไม่ใช้โควตาข้อความของ OA) — ต้องเปิด scope chat_message.write
  let sentTo = '';
  try {
    const ctx = liff.getContext();
    if (ctx && ['utou', 'group', 'room', 'square_chat'].includes(ctx.type)) {
      try { await liff.sendMessages([buildFlex(res)]); }
      catch (flexErr) { await liff.sendMessages([{ type: 'text', text: buildChatText(res) }]); }  // สำรอง: ข้อความธรรมดา
      sentTo = ctx.type === 'utou' ? 'แชทส่วนตัว' : 'กลุ่ม';
    }
  } catch (e) { sentTo = 'ERR:' + (e.message || e); }
  const note = document.createElement('p');
  note.style.cssText = 'font-size:13px;color:var(--mut);margin-top:10px';
  note.textContent = sentTo === 'กลุ่ม' ? '💬 ส่งสรุปเข้ากลุ่มแล้ว'
    : sentTo === 'แชทส่วนตัว' ? '💬 ส่งสรุปเข้าแชทแล้ว — ถ้าต้องการให้ทีมเห็น ให้เปิดฟอร์มจากลิงก์ในกลุ่ม'
    : sentTo.startsWith('ERR') ? '⚠️ ส่งสรุปเข้าแชทไม่สำเร็จ: ' + sentTo.slice(4)
    : '';
  if (note.textContent) $('doneInfo').appendChild(note);
}

/* ชื่อผู้ทำ (แสดงเมื่อไม่ได้ทำครบทุกคน หรือชั่วโมงไม่เท่ากัน) */
function crewLbl(i, s) { return i.crewLabel != null ? i.crewLabel : (i.crewNames && i.crew < s.headcount ? i.crewNames.join(', ') : ''); }

function buildChatText(res) {
  const s = res.summary, L = [
    `📋 Daily Report ${res.reportId}`,
    `📅 ${s.date}  📍 ${s.site}`,
    `👷 ${s.headcount} คน: ${s.employees.join(', ')}`,
    '', '🔧 งานวันนี้:'
  ];
  s.items.forEach(i => L.push(`• ${i.name} ${i.qty} ${i.unit} (${i.crew || s.headcount} คน · ${i.hoursTxt || i.hours} ชม.)` +
    (crewLbl(i, s) ? `\n   ผู้ทำ: ${crewLbl(i, s)}` : '')));
  if ((s.cumulative || []).length) {
    L.push('', `📊 ยอดสะสม ${s.site}:`);
    s.cumulative.forEach(c => L.push(`• ${c.name} ${c.qty} ${c.unit}`));
  }
  if (res.photoCount) L.push('', `🖼 รูปหน้างาน ${res.photoCount} รูป`);
  if (res.pdfUrl) L.push(`📄 PDF: ${res.pdfUrl}`);
  const t = L.join('\n');
  return t.length > 4900 ? t.slice(0, 4890) + '\n…' : t;
}

/* ---------- การ์ด Flex สำหรับโพสต์เข้ากลุ่ม ---------- */
function buildFlex(res) {
  const s = res.summary, MAXROWS = 12;
  const T = (text, o) => Object.assign({ type: 'text', text: String(text || '-'), wrap: true, size: 'sm' }, o || {});
  const row = (name, val, sub) => ({
    type: 'box', layout: 'horizontal', spacing: 'sm', contents: [
      T(name, { flex: 6, color: '#1c2733' }),
      T(val, { flex: 4, align: 'end', weight: 'bold', color: '#1c2733' }),
      ...(sub ? [T(sub, { flex: 2, align: 'end', size: 'xs', color: '#6b7785', gravity: 'center' })] : [])
    ]
  });
  const section = (title, color) => T(title, { weight: 'bold', color, size: 'sm', margin: 'lg' });
  const clip = (arr, fn) => {
    const out = arr.slice(0, MAXROWS).map(fn);
    if (arr.length > MAXROWS) out.push(T(`… และอีก ${arr.length - MAXROWS} รายการ (ดูใน PDF)`, { size: 'xs', color: '#6b7785' }));
    return out;
  };

  const body = [
    T(`👷 ${s.headcount} คน: ${s.employees.join(', ')}`, { color: '#4a5968' }),
    { type: 'separator', margin: 'md' },
    section('🔧 งานวันนี้', '#1f4e78'),
    ...clip(s.items, i => row(crewLbl(i, s) ? `${i.name}\n👷 ${crewLbl(i, s)}` : i.name,
      `${i.qty} ${i.unit}`, `${i.crew || s.headcount}คน ${i.hoursTxt || i.hours}ชม.`))
  ];
  if ((s.cumulative || []).length) {
    body.push({ type: 'separator', margin: 'lg' }, section(`📊 ยอดสะสม ${s.site}`, '#067a36'),
      ...clip(s.cumulative, c => row(c.name, `${c.qty} ${c.unit}`)));
  }
  if (res.photoCount) body.push(T(`🖼 รูปหน้างาน ${res.photoCount} รูป`, { size: 'xs', color: '#6b7785', margin: 'lg' }));

  const bubble = {
    type: 'bubble', size: 'mega',
    header: { type: 'box', layout: 'vertical', backgroundColor: '#1f4e78', paddingAll: '16px', contents: [
      T('📋 DAILY REPORT', { color: '#ffffff', weight: 'bold', size: 'md' }),
      T(`${s.date} · ${s.site}`, { color: '#ffffff', size: 'sm', margin: 'sm' }),
      T(`เลขที่ ${res.reportId}`, { color: '#b9cde0', size: 'xs' })
    ]},
    body: { type: 'box', layout: 'vertical', spacing: 'sm', contents: body }
  };
  if (res.pdfUrl) bubble.footer = { type: 'box', layout: 'vertical', contents: [{
    type: 'button', style: 'primary', color: '#06c755', height: 'sm',
    action: { type: 'uri', label: '📄 เปิด PDF', uri: res.pdfUrl }
  }]};

  const alt = `📋 Daily Report ${s.date} · ${s.site} · ${s.items.length} งาน`;
  return { type: 'flex', altText: alt.slice(0, 400), contents: bubble };
}

function showErr(t) { const m = $('msg'); m.textContent = t; m.className = 'msg err'; window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ---------- Draft (กันข้อมูลหายเมื่อสัญญาณหลุด) ---------- */
function saveDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(collect())); } catch (e) {} }
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
function restoreDraft() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}
  if (!d) { addTaskRow(); return; }
  if (d.workDate) $('workDate').value = d.workDate;
  if (d.siteId) $('site').value = d.siteId;
  (d.empIds || []).forEach(id => { const cb = $('empList').querySelector(`input[value="${CSS.escape(id)}"]`); if (cb) cb.checked = true; });
  (d.items && d.items.length ? d.items : [{}]).forEach(addTaskRow);
  $('note').value = d.note || '';
  setWx('wxAM', d.weatherAM); setWx('wxPM', d.weatherPM);
  (d.issues || []).forEach(addIssueRow);
  $('plan').value = d.planTomorrow || '';
  $('planMan').value = d.planManpower || '';
  renderChips(); updatePer();
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

init();
</script>
